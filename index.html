<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Pages</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }
    h2 {
      margin-top: 1rem;
      color: #444;
      border-bottom: 2px solid #ccc;
    }
    #categories-container {
      width: 90%;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 0.5rem 0;
    }
    a {
      text-decoration: none;
      color: #007BFF;
    }
    a:hover {
      text-decoration: underline;
    }
    section {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <h1>Tyler's Favorite Links</h1>
  <div id="categories-container"></div>

  <script>
    // Load the JSON data
    const loadCategories = async () => {
      try {
        // Fetch the JSON file (update the path if necessary)
        const response = await fetch('links.json');
        const data = await response.json();

        // Render the categories and pages
        const container = document.getElementById('categories-container');
        data.categories.forEach(category => {
          // Create a section for each category
          const categorySection = document.createElement('section');
          const categoryTitle = document.createElement('h2');
          categoryTitle.textContent = category.name;
          categorySection.appendChild(categoryTitle);

          // Create a list of pages for the category
          const pageList = document.createElement('ul');
          category.pages.forEach(page => {
            const listItem = document.createElement('li');
            const link = document.createElement('a');
            link.textContent = page.title;
            link.href = page.url;
            link.target = '_blank'; // Opens the link in a new tab
            listItem.appendChild(link);
            pageList.appendChild(listItem);
          });

          categorySection.appendChild(pageList);
          container.appendChild(categorySection);
        });
      } catch (error) {
        console.error('Error loading JSON data:', error);
      }
    };

    // Call the function to load and render categories
    loadCategories();
  </script>
</body>
</html>
